$(document).ready(function() {
    $('#city').select2({

        minimumResultsForSearch: 0, // always show search
        width: '200px', // make it look like a button
        templateSelection: function (data) {
            return $('<button type="button" class="btn btn-primary btn-sm">' + (data.text || "🔍 Search City") + '</button>');
        },
        templateResult: function (data) {
            if (!data.id) return data.text;
            if ($(data.element).hasClass('bg-primary')) {
                return $('<span style="background:#0d6efd;color:#fff;padding:2px 6px;border-radius:4px;">' + data.text + '</span>');
            }
            return data.text;
        }
    });
});
</script>

       <script>
  document.addEventListener("DOMContentLoaded", function () {
    const dropdown = document.getElementById("dropdown");
    const sectionsContainer = document.getElementById("sections-container");
    const addSectionBtn = document.getElementById("add-section");

    let selectedCount = 0;

    // Create a member input row
    function createSectionRow() {
      const row = document.createElement("div");
      row.classList.add("row", "mb-3", "section-row");

      row.innerHTML = `
        <div class="col-md-6">
          <input type="text" class="form-control" name="sections" placeholder="Student Name">
        </div>
        <div class="col-md-4">
          <input type="number" class="form-control" name="noofquestions" placeholder="Student User ID">
        </div>
        <div class="col-md-2">
          <button type="button" class="btn btn-danger w-100 remove-section">X</button>
        </div>
      `;

      // Add remove button functionality
      row.querySelector(".remove-section").addEventListener("click", () => {
        row.remove();
        updateAddButtonState();
      });

      return row;
    }

    // Update the state of the Add button
    function updateAddButtonState() {
      const currentCount = sectionsContainer.querySelectorAll(".section-row").length;
      addSectionBtn.disabled = currentCount >= selectedCount;
    }

    // When dropdown value changes
    dropdown.addEventListener("change", function () {
      selectedCount = parseInt(this.options[this.selectedIndex].textContent);

      // Clear existing rows
      sectionsContainer.innerHTML = "";

      // Add initial rows
      for (let i = 0; i < selectedCount; i++) {
        sectionsContainer.appendChild(createSectionRow());
      }

      updateAddButtonState();
    });

    // Handle "Add Members" click
    addSectionBtn.addEventListener("click", function () {
      const currentCount = sectionsContainer.querySelectorAll(".section-row").length;

      if (currentCount < selectedCount) {
        sectionsContainer.appendChild(createSectionRow());
        updateAddButtonState();
      }
    });
  });
</script>
